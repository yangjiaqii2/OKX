spring:
  application:
    name: quant-assistant
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:33066}/${MYSQL_DATABASE:OKX}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

quant:
  system:
    fx-rate:
      base: USD
      quote: CNY
      rate: ${QUANT_SYSTEM_FX_USD_CNY_RATE:7.0}
      source: ${QUANT_SYSTEM_FX_USD_CNY_SOURCE:FALLBACK}
      enabled: ${QUANT_SYSTEM_FX_ENABLED:true}
      url: ${QUANT_SYSTEM_FX_URL:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
      fallback-url: ${QUANT_SYSTEM_FX_FALLBACK_URL:https://api.frankfurter.app/latest?from=USD&to=CNY}
      connect-timeout-seconds: ${QUANT_SYSTEM_FX_CONNECT_TIMEOUT_SECONDS:3}
      read-timeout-seconds: ${QUANT_SYSTEM_FX_READ_TIMEOUT_SECONDS:5}
      refresh-cron: ${QUANT_SYSTEM_FX_REFRESH_CRON:0 5 0 * * *}
      zone: ${QUANT_SYSTEM_FX_ZONE:Asia/Shanghai}
  auth:
    username: ${QUANT_AUTH_USERNAME:admin}
    password: ${QUANT_AUTH_PASSWORD:}
    session-ttl-minutes: ${QUANT_AUTH_SESSION_TTL_MINUTES:480}
    registration-enabled: ${QUANT_AUTH_REGISTRATION_ENABLED:true}
    invite-code: ${QUANT_AUTH_INVITE_CODE:}
  mail:
    provider: ${QUANT_MAIL_PROVIDER:DEV_LOG}
    from-address: ${QUANT_MAIL_FROM:noreply@quantdesk.local}
    smtp-host: ${QUANT_MAIL_SMTP_HOST:}
    smtp-port: ${QUANT_MAIL_SMTP_PORT:465}
    smtp-username: ${QUANT_MAIL_SMTP_USERNAME:}
    smtp-password: ${QUANT_MAIL_SMTP_PASSWORD:}
    smtp-ssl: ${QUANT_MAIL_SMTP_SSL:true}
    resend-api-key: ${QUANT_MAIL_RESEND_API_KEY:}
    expose-dev-code: ${QUANT_MAIL_EXPOSE_DEV_CODE:true}
  security:
    credential-master-key: ${QUANT_CREDENTIAL_MASTER_KEY:}
  stock:
    enabled: true
    data-source: AKSHARE
    scan-interval-seconds: 300
    min-turnover-amount: 300000000
    min-change-percent: 2
    max-change-percent: 8
    volume-spike-ratio: 1.5
    exclude-st: true
    analyze-only: true
  contract:
    enabled: true
    exchange: OKX
    scan-interval-seconds: 60
    inst-type: SWAP
    quote-currency: USDT
    min-volume-24h: 10000000
    change-5m-threshold: 1.5
    volume-spike-ratio: 1.8
    max-abs-funding-rate: 0.001
    max-leverage: ${QUANT_CONTRACT_MAX_LEVERAGE:100}
    default-td-mode: cross
    max-single-margin-rate: 0.05
    max-single-loss-rate: 0.01
    max-daily-loss-rate: 0.03
    min-risk-reward-ratio: 1.5
    allow-add-position: false
  agent:
    enabled: false
    mode: MANUAL_CONFIRM
    scan-interval-seconds: 300
    risk-block-scan-interval-seconds: 1800
    top-candidate-limit: 10
    ai-selection:
      enabled: ${QUANT_AGENT_AI_SELECTION_ENABLED:true}
      candidate-limit: ${QUANT_AGENT_AI_SELECTION_CANDIDATE_LIMIT:12}
      policy: ${QUANT_AGENT_AI_SELECTION_POLICY:RULE_FIRST_AI_RANK}
    evaluation:
      ai-entry-tracking-interval-ms: ${QUANT_AGENT_AI_ENTRY_TRACKING_INTERVAL_MS:60000}
      outcome-reconciliation-interval-ms: ${QUANT_AGENT_EVALUATION_OUTCOME_INTERVAL_MS:120000}
      outcome-reconciliation-batch-size: ${QUANT_AGENT_EVALUATION_OUTCOME_BATCH_SIZE:100}
      outcome-reconciliation-retry-delay-ms: ${QUANT_AGENT_EVALUATION_OUTCOME_RETRY_DELAY_MS:300000}
      outcome-reconciliation-stuck-threshold-ms: ${QUANT_AGENT_EVALUATION_OUTCOME_STUCK_THRESHOLD_MS:21600000}
    # V2: Universe Hard Filter + Provider TTL 配置
    selection:
      deep-analysis-limit: ${QUANT_AGENT_DEEP_ANALYSIS_LIMIT:}
      deep-analysis-concurrency: ${QUANT_AGENT_DEEP_ANALYSIS_CONCURRENCY:3}
      # deep-analysis-limit 中划给轮换覆盖的名额（不新增分析量，只改变分配）。设 0 = 纯成交额截断。
      deep-analysis-rotation-quota: ${QUANT_AGENT_DEEP_ANALYSIS_ROTATION_QUOTA:20}
      universe:
        market-cap-enabled: true
        circulation-enabled: ${QUANT_SELECTION_CIRCULATION_ENABLED:false}
        volume-mcap-enabled: ${QUANT_SELECTION_VOLUME_MCAP_ENABLED:false}
        min-market-cap-usd: ${QUANT_SELECTION_MIN_MARKET_CAP_USD:20000000}
        min-circulation-ratio: ${QUANT_SELECTION_MIN_CIRCULATION_RATIO:0.50}
        min-volume-mcap-ratio: ${QUANT_SELECTION_MIN_VOLUME_MCAP_RATIO:0.20}
      providers:
        market-cap-enabled: true
        market-cap-fresh-ttl-seconds: ${QUANT_PROVIDER_MCAP_FRESH_TTL:600}
        market-cap-stale-ttl-seconds: ${QUANT_PROVIDER_MCAP_STALE_TTL:600}
        relative-strength-enabled: ${QUANT_PROVIDER_RELATIVE_STRENGTH_ENABLED:true}
        relative-strength-fresh-ttl-seconds: ${QUANT_PROVIDER_RELATIVE_STRENGTH_FRESH_TTL:60}
        relative-strength-stale-ttl-seconds: ${QUANT_PROVIDER_RELATIVE_STRENGTH_STALE_TTL:600}
        ath-breakout-enabled: ${QUANT_PROVIDER_ATH_BREAKOUT_ENABLED:true}
        ath-breakout-fresh-ttl-seconds: ${QUANT_PROVIDER_ATH_BREAKOUT_FRESH_TTL:600}
        ath-breakout-stale-ttl-seconds: ${QUANT_PROVIDER_ATH_BREAKOUT_STALE_TTL:3600}
        ath-breakout-max-pages: ${QUANT_PROVIDER_ATH_BREAKOUT_MAX_PAGES:50}
      breakout:
        at-ath-pct: ${QUANT_SELECTION_BREAKOUT_AT_ATH_PCT:-2}
        near-ath-pct: ${QUANT_SELECTION_BREAKOUT_NEAR_ATH_PCT:-10}
        mid-range-pct: ${QUANT_SELECTION_BREAKOUT_MID_RANGE_PCT:-40}
        # Phase C/D: CoinGecko real market cap provider
        coingecko:
          enabled: ${QUANT_PROVIDER_COINGECKO_ENABLED:true}
          api-key: ${COINGECKO_API_KEY:}
          api-mode: ${COINGECKO_API_MODE:DEMO}
          rate-limit-per-minute: ${QUANT_PROVIDER_COINGECKO_RPM:20}
        # Wave 2: Derivatives providers (OI History + Funding History)
        derivatives:
          open-interest-enabled: ${QUANT_PROVIDER_OI_ENABLED:true}
          funding-enabled: ${QUANT_PROVIDER_FUNDING_ENABLED:true}
          open-interest-fresh-ttl-seconds: ${QUANT_PROVIDER_OI_FRESH_TTL:60}
          open-interest-stale-ttl-seconds: ${QUANT_PROVIDER_OI_STALE_TTL:600}
          funding-fresh-ttl-seconds: ${QUANT_PROVIDER_FUNDING_FRESH_TTL:300}
          funding-stale-ttl-seconds: ${QUANT_PROVIDER_FUNDING_STALE_TTL:3600}
          extreme-funding-rate: ${QUANT_PROVIDER_EXTREME_FUNDING_RATE:0.0030}
    auto-trade:
      enabled: ${QUANT_AGENT_AUTO_TRADE_ENABLED:true}
      min-score: ${QUANT_AGENT_AUTO_TRADE_MIN_SCORE:60}
      no-risk-min-score: ${QUANT_AGENT_AUTO_TRADE_NO_RISK_MIN_SCORE:70}
      min-risk-reward: 2
      require-backtest-pass: ${QUANT_AGENT_REQUIRE_BACKTEST_PASS:false}
      max-open-positions: ${QUANT_AGENT_MAX_OPEN_POSITIONS:3}
      min-open-positions: ${QUANT_AGENT_MIN_OPEN_POSITIONS:3}
      in-flight-order-hold-seconds: ${QUANT_AGENT_IN_FLIGHT_ORDER_HOLD_SECONDS:120}
    score:
      min-total-score: ${QUANT_AGENT_MIN_TOTAL_SCORE:60}
      min-trend-score: 15
      min-volume-score: 15
      min-liquidity-score: 10
      # Raw news safety score on the 0-100 scale. The weighted contribution remains 5%.
      min-news-risk-raw-score: ${QUANT_AGENT_MIN_NEWS_RISK_RAW_SCORE:70}
    news-risk:
      missing-data-score: ${QUANT_AGENT_NEWS_RISK_MISSING_DATA_SCORE:70}
    market:
      min-volume-24h-usdt: 2000000
      max-spread-bps: 8
      min-depth-usdt: ${QUANT_AGENT_MIN_DEPTH_USDT:5000}
      max-depth-usage-rate: 0.20
      max-funding-abs: 0.0015
      max-wick-ratio: 0.55
      max-24h-range-pct: 40
      max-estimated-slippage-bps: 15
      stale-data-seconds: 20
    entry:
      smart-entry-enabled: true
      market-min-score: 85
      market-min-risk-reward: 1.8
      max-market-spread-pct: 0.03
      max-market-slippage-pct: 0.12
      max-distance-from-ema20-pct: 1.5
      allow-market-signal-types:
        - STRONG_LONG
        - TREND_SHORT
      wait-pullback-signal-types:
        - PULLBACK_LONG
      reversal-short-force-confirm: true
    today-change:
      long-healthy-min-pct: 3
      long-healthy-max-pct: 15
      long-light-overheated-max-pct: 25
      long-high-overheated-max-pct: 50
      long-forbidden-pct: 50
      neutral-min-pct: -3
      neutral-max-pct: 3
      short-weak-min-pct: -10
      short-weak-max-pct: -3
      short-oversold-below-pct: -10
    ranking:
      max-auto-trade-fallback-rank: 5
      min-risk-reward: 1.5
      min-final-rank-score: ${QUANT_AGENT_MIN_FINAL_RANK_SCORE:60}
    budget:
      enabled: true
      input-margin-means-total-budget: true
      allocation-mode: EQUAL_SPLIT
      target-utilization-pct: 100
      min-target-utilization-pct: 100
      max-utilization-pct: 100
      min-order-margin-usdt: 5
      preferred-min-order-margin-usdt: 10
      max-single-position-budget-pct: 33.333334
      slot-weights:
        1: 0.33333334
        2: 0.33333333
        3: 0.33333333
      score-margin-factor:
        score-90-plus: 1.00
        score-85-90: 0.90
        score-80-85: 0.80
        score-75-80: 0.60
        score-70-75: 0.60
        score-60-70: 0.60
      allow-redistribute-unused-budget: true
      redistribute-only-to-score-above: 85
      reserve-inflight-budget: true
      include-manual-positions: false
    fallback:
      continue-on-plan-risk-fail: true
      continue-on-spread-fail: true
      continue-on-slippage-fail: true
      continue-on-ai-plan-invalid: true
      stop-on-okx-api-error: true
      stop-on-account-risk-error: true
      stop-on-protection-fail: true
    position-quality:
      enabled: true
      min-score-by-open-positions:
        0: ${QUANT_AGENT_POSITION_MIN_SCORE_0:60}
        1: ${QUANT_AGENT_POSITION_MIN_SCORE_1:60}
        2: ${QUANT_AGENT_POSITION_MIN_SCORE_2:60}
      min-final-rank-score-by-open-positions:
        0: ${QUANT_AGENT_POSITION_MIN_FINAL_RANK_0:60}
        1: ${QUANT_AGENT_POSITION_MIN_FINAL_RANK_1:60}
        2: ${QUANT_AGENT_POSITION_MIN_FINAL_RANK_2:60}
      max-positions-by-market-regime:
        BULLISH: ${QUANT_AGENT_MAX_POSITIONS_BULLISH:3}
        BEARISH: ${QUANT_AGENT_MAX_POSITIONS_BEARISH:3}
        CHOPPY: ${QUANT_AGENT_MAX_POSITIONS_CHOPPY:2}
        HIGH_VOLATILITY: ${QUANT_AGENT_MAX_POSITIONS_HIGH_VOLATILITY:1}
        RISK_OFF: 0
    exposure:
      enabled: true
      max-same-direction-alt-positions: 2
      max-same-direction-alt-positions-high-volatility: 1
      score-penalty-per-same-direction-position: 4
      exclude-majors-from-alt-count:
        - BTC-USDT-SWAP
        - ETH-USDT-SWAP
    pre-confirm-refresh:
      enabled: true
      max-price-deviation-pct: 0.25
      max-spread-pct: 0.05
      reject-if-5m-reverse: true
      reject-if-btc-reverse: true
      reject-if-news-risk-upgraded: true
    concurrency:
      scan-lock-enabled: true
      auto-trade-lock-enabled: true
      symbol-lock-enabled: true
      symbol-lock-ttl-seconds: 180
    timeout:
      scan-round-timeout-seconds: ${QUANT_AGENT_SCAN_ROUND_TIMEOUT_SECONDS:75}
      ai-plan-timeout-seconds: 12
      market-data-timeout-seconds: 8
      okx-order-submit-timeout-seconds: 8
      okx-order-query-timeout-seconds: 6
      protection-submit-timeout-seconds: 10
      pending-order-expire-seconds: 120
    idempotency:
      enabled: true
      client-order-id-prefix: AUTO
      check-before-retry: true
    retry:
      okx-submit-retry: 1
      okx-query-retry: 3
      retry-backoff-millis: 500
    recovery:
      enabled: true
      interval-seconds: 30
      reserved-budget-timeout-seconds: 180
      submitted-order-timeout-seconds: 60
      protection-pending-timeout-seconds: 20
      unknown-submit-status-timeout-seconds: 60
    protection:
      recalc-after-fill: true
      max-entry-price-deviation-pct: 0.25
      min-risk-reward-after-fill: 1.5
      max-stop-loss-pct-after-fill: 5
      protection-submit-retry: 3
      protection-fail-action: CLOSE_POSITION
    take-profit:
      tp1-ratio: 0.30
      tp2-ratio: 0.40
      tp3-ratio: 0.30
      merge-small-tp-orders: true
      final-tp-use-remaining-size: true
    risk:
      single-trade-risk-percent: 1
      max-single-margin-percent: 33.333334
      max-daily-loss-percent: 30
      max-daily-trades: 5
      max-consecutive-losses: 3
      cooldown-minutes-after-loss: 30
      max-leverage: ${QUANT_AGENT_MAX_LEVERAGE:100}
    monitor:
      interval-seconds: 10
      max-hold-minutes: 120
    lifecycle:
      net-profit-exit-enabled: false
      entry-timeout-minutes: 15
      sideways-position-hours: 3
      sideways-pnl-range-pct: 1
      sideways-exit-profit-pct: 0.3
      loss-close-minutes: 60
      max-hold-minutes: 180
      max-hold-hours: 3
      max-hold-action: CLOSE_POSITION
      sideways-action: TIGHTEN_TAKE_PROFIT
      move-stop-to-breakeven: false
    # Dynamic profit protection. BASELINE values only - none of these has been
    # fitted to historical data. Calibrate with the counterfactual_exit table
    # after this has produced a live sample.
    profit-protection:
      enabled: true
      break-even-activation-r: 0.75
      profit-lock-activation-r: 1.5
      trailing-activation-r: 3.0
      giveback-ratio-pct: 35
      max-giveback-r: 3.0
      round-trip-fee-pct: 0.12
      estimated-slippage-pct: 0.05
      stop-buffer-from-mark-pct: 0.10
      min-stop-improvement-bps: 5
      min-stop-amend-interval-seconds: 60
      max-stop-amends-per-hour: 20
      # Reserved capability only. The cancellation path is not implemented yet:
      # removing TP protection needs demo evidence before it is enabled.
      trailing-cancel-remaining-tp: false

trading:
  mode: ${TRADING_MODE:DISABLED}
  require-user-confirm: true
  order-expire-seconds: 120
  emergency-stop: false

okx:
  api:
    base-url: https://www.okx.com
    key: ${OKX_API_KEY:}
    secret: ${OKX_API_SECRET:}
    passphrase: ${OKX_API_PASSPHRASE:}
  websocket:
    public-url: wss://ws.okx.com:8443/ws/v5/public
    private-url: wss://ws.okx.com:8443/ws/v5/private
    reconnect-delay-ms: 3000
    heartbeat-interval-ms: 15000
    max-market-delay-ms: 5000

news:
  enabled: true
  provider: ${QUANT_NEWS_PROVIDER:OKX}
  max-results-per-symbol: 10
  lookback-hours-stock: 72
  lookback-hours-crypto: 24
  use-mock-when-no-provider: false

akshare:
  base-url: ${AKSHARE_BASE_URL:http://127.0.0.1:18080}

ai:
  enabled: true
  provider: ${AI_PROVIDER:OPENAI_COMPATIBLE}
  model: ${AI_MODEL:kimi-k2.6}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.moonshot.cn/v1}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:20}
  max-retries: ${AI_MAX_RETRIES:0}
  # 填写 Jev 时将 AI_PROVIDER 改为 TYPESAFE；默认仍使用现有 OpenAI-compatible 链路。
  typesafe-api-key: ${TYPESAFE_API_KEY:}
  typesafe-base-url: ${TYPESAFE_BASE_URL:https://api.typesafe.ai}
  typesafe-model: ${TYPESAFE_MODEL:jev-latest}

notification:
  enabled: ${NOTIFICATION_ENABLED:false}
  dispatch-interval-ms: 10000
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    send-timeout-seconds: ${TELEGRAM_SEND_TIMEOUT_SECONDS:8}
    max-attempts: ${TELEGRAM_MAX_ATTEMPTS:5}
