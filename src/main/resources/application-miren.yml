server:
  port: 8080
  # The Miren ingress terminates HTTPS and sets X-Forwarded-Proto and Host.
  forward-headers-strategy: native

spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    create-schemas: false
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

quant:
  auth:
    password: ${QUANT_AUTH_PASSWORD}
  security:
    credential-master-key: ${QUANT_CREDENTIAL_MASTER_KEY}
  contract:
    enabled: ${QUANT_CONTRACT_ENABLED:true}
  agent:
    auto-trade:
      enabled: ${QUANT_AGENT_AUTO_TRADE_ENABLED:false}
    recovery:
      enabled: ${QUANT_AGENT_RECOVERY_ENABLED:true}

trading:
  mode: ${TRADING_MODE:DEMO}

okx:
  api:
    base-url: ${OKX_API_BASE_URL:https://www.okx.com}
  websocket:
    public-url: ${OKX_WS_PUBLIC_URL:wss://ws.okx.com:8443/ws/v5/public}
    private-url: ${OKX_WS_PRIVATE_URL:wss://ws.okx.com:8443/ws/v5/private}
