spring:
  datasource:
    url: jdbc:h2:mem:quant_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

quant:
  system:
    fx-rate:
      enabled: false
  auth:
    username: test-admin
    password: test-admin-password
  contract:
    enabled: false

trading:
  mode: DISABLED
  require-user-confirm: true
  emergency-stop: false
  order-expire-seconds: 120
