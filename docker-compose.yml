services:
  mysql:
    image: mysql:${MYSQL_IMAGE_TAG:-8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OKX}
      MYSQL_USER: ${MYSQL_USERNAME:-okx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - backend

  app:
    image: ${OKX_APP_IMAGE:?OKX_APP_IMAGE is required}
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OKX}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-okx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      QUANT_AUTH_USERNAME: ${QUANT_AUTH_USERNAME:-admin}
      QUANT_AUTH_PASSWORD: ${QUANT_AUTH_PASSWORD:?QUANT_AUTH_PASSWORD is required}
      QUANT_AUTH_SESSION_TTL_MINUTES: ${QUANT_AUTH_SESSION_TTL_MINUTES:-480}
      QUANT_CREDENTIAL_MASTER_KEY: ${QUANT_CREDENTIAL_MASTER_KEY:?QUANT_CREDENTIAL_MASTER_KEY is required}
      TRADING_MODE: ${TRADING_MODE:?TRADING_MODE is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      QUANT_AGENT_AUTO_TRADE_ENABLED: ${QUANT_AGENT_AUTO_TRADE_ENABLED:-false}
      QUANT_AGENT_MAX_OPEN_POSITIONS: ${QUANT_AGENT_MAX_OPEN_POSITIONS:-3}
      QUANT_AGENT_MIN_OPEN_POSITIONS: ${QUANT_AGENT_MIN_OPEN_POSITIONS:-3}
      QUANT_AGENT_MAX_POSITIONS_BULLISH: ${QUANT_AGENT_MAX_POSITIONS_BULLISH:-3}
      QUANT_AGENT_MAX_POSITIONS_BEARISH: ${QUANT_AGENT_MAX_POSITIONS_BEARISH:-3}
      QUANT_AGENT_MAX_POSITIONS_CHOPPY: ${QUANT_AGENT_MAX_POSITIONS_CHOPPY:-2}
      QUANT_AGENT_MAX_POSITIONS_HIGH_VOLATILITY: ${QUANT_AGENT_MAX_POSITIONS_HIGH_VOLATILITY:-1}
      QUANT_AGENT_MAX_LEVERAGE: ${QUANT_AGENT_MAX_LEVERAGE:-10}
      QUANT_CONTRACT_MAX_LEVERAGE: ${QUANT_CONTRACT_MAX_LEVERAGE:-10}
      QUANT_SYSTEM_FX_ENABLED: ${QUANT_SYSTEM_FX_ENABLED:-true}
      QUANT_SYSTEM_FX_USD_CNY_RATE: ${QUANT_SYSTEM_FX_USD_CNY_RATE:-7.0}
      QUANT_SYSTEM_FX_USD_CNY_SOURCE: ${QUANT_SYSTEM_FX_USD_CNY_SOURCE:-FALLBACK}
      QUANT_SYSTEM_FX_URL: ${QUANT_SYSTEM_FX_URL:-https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
      QUANT_SYSTEM_FX_FALLBACK_URL: ${QUANT_SYSTEM_FX_FALLBACK_URL:-https://api.frankfurter.app/latest?from=USD&to=CNY}
      QUANT_SYSTEM_FX_CONNECT_TIMEOUT_SECONDS: ${QUANT_SYSTEM_FX_CONNECT_TIMEOUT_SECONDS:-3}
      QUANT_SYSTEM_FX_READ_TIMEOUT_SECONDS: ${QUANT_SYSTEM_FX_READ_TIMEOUT_SECONDS:-5}
      QUANT_SYSTEM_FX_REFRESH_CRON: ${QUANT_SYSTEM_FX_REFRESH_CRON:-0 5 0 * * *}
      QUANT_SYSTEM_FX_ZONE: ${QUANT_SYSTEM_FX_ZONE:-Asia/Shanghai}
      QUANT_NEWS_PROVIDER: ${QUANT_NEWS_PROVIDER:-OKX}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI_COMPATIBLE}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.b.ai/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-deepseek-v4.1-flash}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-20}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-0}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      QUANT_AGENT_AI_SELECTION_ENABLED: ${QUANT_AGENT_AI_SELECTION_ENABLED:-true}
      QUANT_AGENT_AI_SELECTION_CANDIDATE_LIMIT: ${QUANT_AGENT_AI_SELECTION_CANDIDATE_LIMIT:-12}
      QUANT_AGENT_AUTO_TRADE_MIN_SCORE: ${QUANT_AGENT_AUTO_TRADE_MIN_SCORE:-60}
      QUANT_AGENT_DEEP_ANALYSIS_ROTATION_QUOTA: ${QUANT_AGENT_DEEP_ANALYSIS_ROTATION_QUOTA:-20}
      QUANT_AGENT_DEEP_ANALYSIS_CONCURRENCY: ${QUANT_AGENT_DEEP_ANALYSIS_CONCURRENCY:-4}
      QUANT_AGENT_DEEP_ANALYSIS_LIMIT: ${QUANT_AGENT_DEEP_ANALYSIS_LIMIT:-}
      QUANT_SELECTION_CIRCULATION_ENABLED: ${QUANT_SELECTION_CIRCULATION_ENABLED:-false}
      QUANT_SELECTION_VOLUME_MCAP_ENABLED: ${QUANT_SELECTION_VOLUME_MCAP_ENABLED:-false}
      QUANT_SELECTION_MIN_CIRCULATION_RATIO: ${QUANT_SELECTION_MIN_CIRCULATION_RATIO:-0.50}
      QUANT_SELECTION_MIN_VOLUME_MCAP_RATIO: ${QUANT_SELECTION_MIN_VOLUME_MCAP_RATIO:-0.20}
      QUANT_AGENT_MIN_DEPTH_USDT: ${QUANT_AGENT_MIN_DEPTH_USDT:-5000}
      QUANT_AGENT_MIN_TOTAL_SCORE: ${QUANT_AGENT_MIN_TOTAL_SCORE:-60}
      QUANT_AGENT_MIN_FINAL_RANK_SCORE: ${QUANT_AGENT_MIN_FINAL_RANK_SCORE:-60}
      QUANT_AGENT_NEWS_RISK_MISSING_DATA_SCORE: ${QUANT_AGENT_NEWS_RISK_MISSING_DATA_SCORE:-70}
      QUANT_AGENT_MIN_NEWS_RISK_RAW_SCORE: ${QUANT_AGENT_MIN_NEWS_RISK_RAW_SCORE:-70}
      QUANT_AGENT_POSITION_MIN_SCORE_0: ${QUANT_AGENT_POSITION_MIN_SCORE_0:-60}
      QUANT_AGENT_POSITION_MIN_SCORE_1: ${QUANT_AGENT_POSITION_MIN_SCORE_1:-60}
      QUANT_AGENT_POSITION_MIN_SCORE_2: ${QUANT_AGENT_POSITION_MIN_SCORE_2:-60}
      QUANT_AGENT_POSITION_MIN_FINAL_RANK_0: ${QUANT_AGENT_POSITION_MIN_FINAL_RANK_0:-60}
      QUANT_AGENT_POSITION_MIN_FINAL_RANK_1: ${QUANT_AGENT_POSITION_MIN_FINAL_RANK_1:-60}
      QUANT_AGENT_POSITION_MIN_FINAL_RANK_2: ${QUANT_AGENT_POSITION_MIN_FINAL_RANK_2:-60}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_API_MODE: ${COINGECKO_API_MODE:-DEMO}
      QUANT_PROVIDER_COINGECKO_RPM: ${QUANT_PROVIDER_COINGECKO_RPM:-30}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SEND_TIMEOUT_SECONDS: ${TELEGRAM_SEND_TIMEOUT_SECONDS:-8}
      TELEGRAM_MAX_ATTEMPTS: ${TELEGRAM_MAX_ATTEMPTS:-5}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend

volumes:
  mysql-data:

networks:
  backend:
    driver: bridge
